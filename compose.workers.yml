name: ${PAPERASSIST_STACK_PROJECT:?Run through script/dev.cmd or worker_stack.py}
x-worker: &worker
  image: ${PAPERASSIST_STACK_PROJECT}-worker:local
  build:
    context: .
    dockerfile: infra/worker/Dockerfile
  init: true
  environment: &worker-environment
    PAPERASSIST_ENV: ${PAPERASSIST_ENV}
    PAPERASSIST_DB_SCHEMA: ${PAPERASSIST_DB_SCHEMA}
    PAPERASSIST_DATA_DIR: /data
    PAPERASSIST_BROKER_URL_FILE: /run/secrets/broker-url
    PAPERASSIST_TASK_QUEUE: ${PAPERASSIST_TASK_QUEUE}
    PAPERASSIST_QUEUE_TEST_ALLOWED: ${PAPERASSIST_QUEUE_TEST_ALLOWED}
    PAPERASSIST_DATABASE_URL_FILE: /run/secrets/database-url
    PAPERASSIST_TEST_DATABASE_URL_FILE: /run/secrets/database-url
    PAPERASSIST_WORKER_HEALTH_FILE: /tmp/dispatcher-health
    PAPERASSIST_PDF_FONTS_DIR: /usr/local/share/fonts/paperassist
  secrets:
    - source: database-url
      target: database-url
    - source: broker-url
      target: broker-url
  volumes:
    - type: bind
      source: ${PAPERASSIST_STACK_DATA}
      target: /data
    - ${PAPERASSIST_PDF_FONTS}/arial.ttf:/usr/local/share/fonts/paperassist/arial.ttf:ro
    - ${PAPERASSIST_PDF_FONTS}/simsun.ttc:/usr/local/share/fonts/paperassist/simsun.ttc:ro
  labels:
    io.paperassist.workspace: ${PAPERASSIST_STACK_ROOT}
  depends_on:
    rabbitmq:
      condition: service_healthy
  stop_grace_period: 45s
services:
  rabbitmq:
    image: rabbitmq:4.3.6-alpine@sha256:2cb43283d8bbd3caa6c0f0dc00e96c8de772df33df7fd8af6aee4d605aeb8ada
    hostname: rabbitmq
    labels:
      io.paperassist.workspace: ${PAPERASSIST_STACK_ROOT}
    secrets:
      - source: rabbitmq-config
        target: /etc/rabbitmq/rabbitmq.conf
    volumes:
      - broker-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
  worker:
    <<: *worker
    mem_limit: 2g
    environment:
      <<: *worker-environment
      OPENAI_API_KEY_FILE: /run/secrets/model-api-key
      PAPERASSIST_WRITING_LIVE_ENABLED: ${PAPERASSIST_WRITING_LIVE_ENABLED:-0}
      PAPERASSIST_NCBI_CONFIG_FILE: /run/secrets/ncbi-config
      PAPERASSIST_WORKER_CONFIG_REVISION: ${PAPERASSIST_WORKER_CONFIG_REVISION}
      PAPERASSIST_PDF_RENDERER_URL: http://pdf-renderer:8080
    networks: [default, pdf-internal]
    depends_on:
      rabbitmq:
        condition: service_healthy
      pdf-renderer:
        condition: service_healthy
    secrets:
      - source: database-url
        target: database-url
      - source: broker-url
        target: broker-url
      - source: model-api-key
        target: model-api-key
      - source: ncbi-config
        target: ncbi-config
    command: [python, -m, app.workers, worker]
    healthcheck:
      test: [CMD, python, -m, app.workers, health, worker]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 10s
  dispatcher:
    <<: *worker
    command: [python, -m, app.workers, dispatch]
    healthcheck:
      test: [CMD, python, -m, app.workers, health, dispatch]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
  pdf-renderer:
    image: ${PAPERASSIST_STACK_PROJECT}-pdf-renderer:local
    build:
      context: .
      dockerfile: infra/pdf/Dockerfile
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [pdf-internal]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    tmpfs:
      - /tmp:size=512m,mode=1777
    labels:
      io.paperassist.workspace: ${PAPERASSIST_STACK_ROOT}
    volumes:
      - ${PAPERASSIST_PDF_FONTS}/arial.ttf:/usr/local/share/fonts/paperassist/arial.ttf:ro
      - ${PAPERASSIST_PDF_FONTS}/arialbd.ttf:/usr/local/share/fonts/paperassist/arialbd.ttf:ro
      - ${PAPERASSIST_PDF_FONTS}/arialbi.ttf:/usr/local/share/fonts/paperassist/arialbi.ttf:ro
      - ${PAPERASSIST_PDF_FONTS}/ariali.ttf:/usr/local/share/fonts/paperassist/ariali.ttf:ro
      - ${PAPERASSIST_PDF_FONTS}/simsun.ttc:/usr/local/share/fonts/paperassist/simsun.ttc:ro
      - ${PAPERASSIST_PDF_FONTS}/calibri.ttf:/usr/local/share/fonts/paperassist/calibri.ttf:ro
      - ${PAPERASSIST_PDF_FONTS}/calibrib.ttf:/usr/local/share/fonts/paperassist/calibrib.ttf:ro
      - ${PAPERASSIST_PDF_FONTS}/calibrii.ttf:/usr/local/share/fonts/paperassist/calibrii.ttf:ro
      - ${PAPERASSIST_PDF_FONTS}/calibriz.ttf:/usr/local/share/fonts/paperassist/calibriz.ttf:ro
      - ${PAPERASSIST_PDF_FONTS}/calibril.ttf:/usr/local/share/fonts/paperassist/calibril.ttf:ro
      - ${PAPERASSIST_PDF_FONTS}/calibrili.ttf:/usr/local/share/fonts/paperassist/calibrili.ttf:ro
      - ${PAPERASSIST_PDF_FONTS}/msyh.ttc:/usr/local/share/fonts/paperassist/msyh.ttc:ro
      - ${PAPERASSIST_PDF_FONTS}/msyhbd.ttc:/usr/local/share/fonts/paperassist/msyhbd.ttc:ro
      - ${PAPERASSIST_PDF_FONTS}/msyhl.ttc:/usr/local/share/fonts/paperassist/msyhl.ttc:ro
      - ${PAPERASSIST_PDF_FONTS}/cambria.ttc:/usr/local/share/fonts/paperassist/cambria.ttc:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 45s
secrets:
  ncbi-config:
    file: ${PAPERASSIST_STACK_PRIVATE}/ncbi-config
  model-api-key:
    file: ${PAPERASSIST_STACK_PRIVATE}/model-api-key
  database-url:
    file: ${PAPERASSIST_STACK_PRIVATE}/database-url
  broker-url:
    file: ${PAPERASSIST_STACK_PRIVATE}/broker-url
  rabbitmq-config:
    file: ${PAPERASSIST_STACK_PRIVATE}/rabbitmq.conf
volumes:
  broker-data:
networks:
  pdf-internal:
    internal: true
