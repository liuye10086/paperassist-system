name: ${RELEASE_PROJECT:?Use script/release/release.py}
x-environment: &environment
  PAPERASSIST_ENV: production
  PAPERASSIST_DB_SCHEMA: public
  PAPERASSIST_DATA_DIR: /data
  PAPERASSIST_DATABASE_URL_FILE: /run/secrets/database-url
  PAPERASSIST_BROKER_URL_FILE: /run/secrets/broker-url
  PAPERASSIST_TASK_QUEUE: paperassist.release.${RELEASE_NAMESPACE}
  PAPERASSIST_RUNTIME_CONTROL_DIR: /control
  PAPERASSIST_RUNTIME_NAMESPACE: ${RELEASE_NAMESPACE}
  PAPERASSIST_WORKER_CONCURRENCY_CEILING: '2'
  PAPERASSIST_WRITING_LIVE_ENABLED: '0'
  PAPERASSIST_PLOT_WORKER_ENABLED: '0'
  PAPERASSIST_NCBI_ENABLED: '0'
  PAPERASSIST_AUTH_TRUSTED_ORIGINS: https://localhost:${RELEASE_PORT}
  PAPERASSIST_PDF_RENDERER_URL: http://pdf-renderer:8080
  PAPERASSIST_WORKER_HEALTH_FILE: /tmp/dispatcher-health
  PAPERASSIST_PDF_FONTS_DIR: /usr/local/share/fonts/paperassist
x-app: &app
  image: ${RELEASE_IMAGE}
  pull_policy: never
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [private]
  environment: *environment
  secrets: [database-url, broker-url]
  volumes:
    - ${RELEASE_DIRECTORY}/assets:/data
    - ${RELEASE_DIRECTORY}/control:/control:ro
  tmpfs: ['/tmp:size=256m,mode=1777']
  labels: &labels
    io.paperassist.release: ${RELEASE_NAMESPACE}
    io.paperassist.workspace: ${RELEASE_ROOT}
  stop_grace_period: 120s
services:
  db:
    image: postgres@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    pull_policy: never
    environment:
      POSTGRES_DB: paperassist_system
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password]
    volumes:
      - database:/var/lib/postgresql
      - ${RELEASE_DIRECTORY}/backups:/backups
    networks: [private]
    labels: *labels
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, paperassist_system]
      interval: 5s
      timeout: 3s
      retries: 20
  broker:
    image: rabbitmq:4.3.6-alpine@sha256:2cb43283d8bbd3caa6c0f0dc00e96c8de772df33df7fd8af6aee4d605aeb8ada
    pull_policy: never
    hostname: broker
    secrets:
      - source: rabbitmq-config
        target: /etc/rabbitmq/rabbitmq.conf
    volumes: [broker:/var/lib/rabbitmq]
    networks: [private]
    labels: *labels
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    <<: *app
    command: [python, release_web.py]
    networks: [private, front]
    ports: ['127.0.0.1:${RELEASE_PORT}:8443']
    volumes:
      - ${RELEASE_DIRECTORY}/assets:/data
      - ${RELEASE_DIRECTORY}/control:/control:ro
      - ${RELEASE_DIRECTORY}/tls:/run/tls:ro
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/api/v1/health',context=ssl.create_default_context(cafile='/run/tls/ca.pem'),timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 6
  worker:
    <<: *app
    command: [python, -m, app.workers, worker]
    volumes:
      - ${RELEASE_DIRECTORY}/assets:/data
      - ${RELEASE_DIRECTORY}/control:/control
      - ${RELEASE_FONTS}/arial.ttf:/usr/local/share/fonts/paperassist/arial.ttf:ro
      - ${RELEASE_FONTS}/simsun.ttc:/usr/local/share/fonts/paperassist/simsun.ttc:ro
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: [CMD, python, -m, app.workers, health, worker]
      interval: 15s
      timeout: 8s
      retries: 6
  dispatcher:
    <<: *app
    command: [python, -m, app.workers, dispatch]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, python, -m, app.workers, health, dispatch]
      interval: 15s
      timeout: 5s
      retries: 6
  migration:
    <<: *app
    profiles: [operator]
    secrets: [database-url, broker-url, migration-url]
    mem_limit: 512m
    cpus: 0.5
    command: [python, release_entry.py, migrate]
  collector:
    <<: *app
    profiles: [operator]
    volumes:
      - ${RELEASE_DIRECTORY}/assets:/data:ro
      - ${RELEASE_DIRECTORY}/control:/control
    mem_limit: 256m
    cpus: 0.5
    command: [python, release_entry.py, collect]
  renderer:
    image: sha256:8b341880cc1533d0a301e7c9ec60493aba67f1464e1efc00820db9044b15bfde
    pull_policy: never
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      private:
        aliases: [pdf-renderer]
    labels: *labels
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    tmpfs: ['/tmp:size=512m,mode=1777']
    volumes:
      - ${RELEASE_FONTS}/arial.ttf:/usr/local/share/fonts/paperassist/arial.ttf:ro
      - ${RELEASE_FONTS}/arialbd.ttf:/usr/local/share/fonts/paperassist/arialbd.ttf:ro
      - ${RELEASE_FONTS}/arialbi.ttf:/usr/local/share/fonts/paperassist/arialbi.ttf:ro
      - ${RELEASE_FONTS}/ariali.ttf:/usr/local/share/fonts/paperassist/ariali.ttf:ro
      - ${RELEASE_FONTS}/simsun.ttc:/usr/local/share/fonts/paperassist/simsun.ttc:ro
      - ${RELEASE_FONTS}/calibri.ttf:/usr/local/share/fonts/paperassist/calibri.ttf:ro
      - ${RELEASE_FONTS}/calibrib.ttf:/usr/local/share/fonts/paperassist/calibrib.ttf:ro
      - ${RELEASE_FONTS}/calibrii.ttf:/usr/local/share/fonts/paperassist/calibrii.ttf:ro
      - ${RELEASE_FONTS}/calibriz.ttf:/usr/local/share/fonts/paperassist/calibriz.ttf:ro
      - ${RELEASE_FONTS}/calibril.ttf:/usr/local/share/fonts/paperassist/calibril.ttf:ro
      - ${RELEASE_FONTS}/calibrili.ttf:/usr/local/share/fonts/paperassist/calibrili.ttf:ro
      - ${RELEASE_FONTS}/msyh.ttc:/usr/local/share/fonts/paperassist/msyh.ttc:ro
      - ${RELEASE_FONTS}/msyhbd.ttc:/usr/local/share/fonts/paperassist/msyhbd.ttc:ro
      - ${RELEASE_FONTS}/msyhl.ttc:/usr/local/share/fonts/paperassist/msyhl.ttc:ro
      - ${RELEASE_FONTS}/cambria.ttc:/usr/local/share/fonts/paperassist/cambria.ttc:ro
      - ${RELEASE_FONTS}/simhei.ttf:/usr/local/share/fonts/paperassist/simhei.ttf:ro
      - ${RELEASE_FONTS}/times.ttf:/usr/local/share/fonts/paperassist/times.ttf:ro
      - ${RELEASE_FONTS}/timesbd.ttf:/usr/local/share/fonts/paperassist/timesbd.ttf:ro
      - ${RELEASE_FONTS}/timesbi.ttf:/usr/local/share/fonts/paperassist/timesbi.ttf:ro
      - ${RELEASE_FONTS}/timesi.ttf:/usr/local/share/fonts/paperassist/timesi.ttf:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 6
secrets:
  database-url:
    file: ${RELEASE_DIRECTORY}/private/database-url
  migration-url:
    file: ${RELEASE_DIRECTORY}/private/migration-url
  postgres-password:
    file: ${RELEASE_DIRECTORY}/private/postgres-password
  broker-url:
    file: ${RELEASE_DIRECTORY}/private/broker-url
  rabbitmq-config:
    file: ${RELEASE_DIRECTORY}/private/rabbitmq.conf
volumes:
  database:
  broker:
networks:
  private:
    internal: true
  front:
    internal: false
